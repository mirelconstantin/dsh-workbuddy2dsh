name: ci

# Every push and pull request, on three operating systems.
#
# The plugin is a Node package and the gateway is a Go binary, so this checks
# both halves independently on ubuntu / windows / macos: the unit suite and the
# static contract check, then a real Go build of the gateway for the runner's
# platform — which is the only way to know the plugin's `bin/` layout is right
# rather than merely asserted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: plugin checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # No `cache: npm` here on purpose: it requires a package-lock.json,
          # and this plugin ships none — it declares a single optional peer
          # dependency and installs nothing of its own.
          node-version: 24

      - name: install the peer dependency the host would otherwise supply
        run: npm install --no-save @deepseek-ai/schemastery

      - name: install the browser-half build toolchain
        run: npm install --no-save --no-audit --no-fund tsdown@^0.15.0 lightningcss@1.32.0 typescript@^5.9.0 react@^18.3.1 react-dom@^18.3.1 @types/react@~18.3.31 @types/react-dom@~18.3.7 @types/node@^24.0.0 @deepseek-ai/dsh-client-locale@0.2.0-rc.2 @deepseek-ai/dsh-client-ui-renderer@0.2.0-rc.2 @deepseek-ai/dsh-client-ui-primitives@0.2.0-rc.2 @deepseek-ai/dsh-client-ui-slots@0.2.0-rc.2 @deepseek-ai/cordis@^4.0.4

      - name: typecheck the browser half
        run: npm run typecheck

      - name: build the browser half
        run: npm run build:client

      - name: static contract check
        run: npm run check

      - name: unit suite
        run: npm test

      - name: the setup script is runnable from a clean checkout
        run: node scripts/build-gateway.mjs --help

  gateway:
    name: gateway build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wb2api-linux-amd64
          - os: windows-latest
            artifact: wb2api-windows-amd64.exe
          - os: macos-latest
            artifact: wb2api-darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Pinned, not `go-version-file`: Go 1.27 links Darwin binaries
          # without the LC_UUID command this macOS release's dyld requires, so
          # the binary aborts on launch. go.mod's `go 1.22.5` directive picks
          # up whatever toolchain is newest otherwise.
          go-version: '1.23.x'

      - name: build for this platform
        run: go build -trimpath -ldflags="-s -w" -o "${{ matrix.artifact }}" ./cmd/server

      - name: the binary answers /healthz
        shell: bash
        run: |
          set -euo pipefail
          DIR="$(mktemp -d)"
          mkdir -p "$DIR/auths" "$DIR/data"

          # The gateway logs the *configured* listen address, so parsing it for
          # a port cannot work when that address is :0. The port is reserved
          # here and handed to the child instead — the same free-port probe the
          # plugin itself uses (src/health.js), so this checks the real thing.
          PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')"
          printf '{"listen":"127.0.0.1:%s","api_key":"sk-ci","auth_dir":"%s/auths","state_file":"%s/data/state.json"}' \
            "$PORT" "$DIR" "$DIR" > "$DIR/config.json"

          BIN=""
          for candidate in "./${{ matrix.artifact }}" "./${{ matrix.artifact }}.exe"; do
            [ -x "$candidate" ] && BIN="$candidate" && break
          done
          if [ -z "$BIN" ]; then
            echo "no built binary found next to the repo root"; ls -la; exit 1
          fi

          "$BIN" -config "$DIR/config.json" > "$DIR/log" 2>&1 &
          CHILD=$!
          trap 'kill $CHILD 2>/dev/null || true' EXIT

          # 503 with an empty account pool is the documented healthy state; a
          # connection failure is the only real failure.
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null --max-time 2 "http://127.0.0.1:${PORT}/healthz"; then break; fi
            if ! kill -0 $CHILD 2>/dev/null; then
              echo "the gateway exited during startup:"; cat "$DIR/log"; exit 1
            fi
            sleep 0.5
          done

          echo "gateway is on 127.0.0.1:${PORT}"
          curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/healthz" && echo "/healthz answers"
          curl -fsS -o /dev/null -H "Authorization: Bearer sk-ci" \
            "http://127.0.0.1:${PORT}/v1/models" && echo "/v1/models answers with the key"
          # The panel is embedded in the binary, so a missing one means a
          # broken build even when the API surface is intact.
          curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/panel/" && echo "/panel/ answers"

      - name: upload the platform binary
        uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.os }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.exe
          if-no-files-found: warn
          retention-days: 7
